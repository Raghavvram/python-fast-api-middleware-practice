services:
  postgres-db:
    image: postgres:17
    ports:
      - "${PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DBNAME}
    restart: unless-stopped

volumes:
  postgres_data:
